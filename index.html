<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinRewards - Earn Rewards</title>
    
    <!-- Adsterra Popunder Ad Script -->
    <script data-cfasync="false" src="https://ahuramazda.org/1/da1e9ec68893a06517bb877b2053afb6"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ffcc00;
        }
        p {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .referral-box {
            background: rgba(255, 204, 0, 0.1);
            border: 1px dashed #ffcc00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ffcc00;
            font-weight: bold;
            display: none;
        }
        .btn {
            display: inline-block;
            background: #ffcc00;
            color: #1e1e2f;
            padding: 12px 30px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s ease;
        }
        .btn:hover {
            background: #e6b800;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CoinRewards</h1>
        
        <!-- Referral Message Box -->
        <div id="ref-alert" class="referral-box">
            🎉 Aapko <span id="ref-name"></span> ki taraf se special invite mila hai!
        </div>

        <p>Hamari nayi app aur website jaldi hi live hone wali hai! Yahan aapko behtareen rewards aur offers milenge.</p>
        <a href="#" class="btn">Coming Soon</a>
    </div>

    <script>
        // URL se referral code pakadne ka code
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');

        if (refCode) {
            const refAlert = document.getElementById('ref-alert');
            const refName = document.getElementById('ref-name');
            
            refName.innerText = refCode;
            refAlert.style.display = 'block';
        }
    </script>

</body>
</html>
